{% extends 'base.html' %}

{% block titulo %}Trocar senha – Financeiro{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <h1 class="h4 mb-3">Trocar senha</h1>
    <form method="post">
      {% csrf_token %} {% include 'nucleo/componentes/campos_formulario.html' %}
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a class="btn btn-outline-secondary" href="{% url 'nucleo:inicio' %}"
        >Cancelar</a
      >
    </form>
  </div>
</div>
{% endblock %}
