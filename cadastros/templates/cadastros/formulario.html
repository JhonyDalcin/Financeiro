{% extends 'base.html' %}

{% block titulo %}{{ view.titulo }} – Financeiro{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h4">{{ view.titulo }}</h1>
    <p class="text-muted">
      {% if object %}Editar registro{% else %}Novo registro{% endif %}
    </p>
    <form method="post">
      {% csrf_token %} {% include 'nucleo/componentes/campos_formulario.html' %}
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a class="btn btn-outline-secondary" href="{% url view.url_lista %}"
        >Cancelar</a
      >
    </form>
  </div>
</div>
{% endblock %}
